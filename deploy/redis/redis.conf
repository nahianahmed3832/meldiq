bind 0.0.0.0
port 6379
protected-mode yes
aclfile /run/secrets/meldiq_redis_acl
maxmemory 128mb
# Fixed-window rate counters must not be evicted early. All application keys expire.
maxmemory-policy noeviction
maxclients 64
timeout 300
tcp-keepalive 60
# Redis contains no durable business records or critical work queues.
save ""
appendonly no
loglevel notice
