# Checks every push to internal-beta, every pull request and any manual run (docs/CI.md).
# It runs the commands developers already run (README.md › Build, docs/TESTING.md). It never signs, publishes or
# deploys anything, and it has no secrets: it uploads test and lint reports only, never an APK or bundle.
name: CI

on:
  push:
    branches: [internal-beta]
  pull_request:
  workflow_dispatch:
    inputs:
      server_only:
        description: Check only the API server
        type: boolean
        default: false
      server_test_files:
        description: Optional space-separated server test paths (empty runs the full suite)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the older run. Runs on internal-beta always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server (typecheck, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3 # the version in server/Dockerfile, which production runs
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install (exact versions from package-lock.json)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install isolated Redis test dependency
        run: sudo apt-get update && sudo apt-get install -y redis-server
      # Includes the shared griip-envelope-v1 vectors (test/interop_vectors.test.ts), which the Android job checks too.
      # The real-S3 suite skips itself: CI has no AWS credentials and no ORBIT_LIVE_S3_BUCKET.
      # A throwaway local MongoDB replica set comes up for the run (test/support/mongoGlobal.ts; the mongod binary is
      # fetched by mongodb-memory-server). No shared or production database, no credentials.
      - name: Unit and integration tests
        env:
          SERVER_TEST_FILES: ${{ inputs.server_test_files }}
        run: |
          if [ -n "$SERVER_TEST_FILES" ]; then
            read -ra test_files <<< "$SERVER_TEST_FILES"
            npm test -- --maxWorkers=2 "${test_files[@]}"
          else
            npm test
          fi
      - if: ${{ !inputs.server_test_files }}
        name: The same tests with the MongoDB-capable domains in MongoDB (docs/MONGODB.md, docs/product/MELDIQ_MONGODB_MIGRATION.md)
        run: npm test
        env:
          MELDIQ_TEST_MONGO_DOMAINS: accounts,preferences,history,reports,relationships,relay,files
      - name: Build
        run: npm run build
      - name: Export checked API build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meldiq-api-build
          path: server/dist/
          retention-days: 7

  android:
    if: ${{ !inputs.server_only }}
    name: Android (unit tests, lint, debug and release builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21 # Android Studio's bundled JBR, which local builds use (README.md › Build)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic # open-source caching on actions/cache
          cache-read-only: ${{ github.ref != 'refs/heads/internal-beta' }}
          validate-wrappers: true
      # Includes the shared vectors (EnvelopeInteropTest, PayloadVectorsTest) and the Room migration tests.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      # The later steps run even when an earlier one fails, so one run reports every failure. The job still fails.
      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintDebug
      # The release build is unsigned (the upload key never leaves the owner's machine; docs/RELEASE_BUILDS.md).
      # It checks that R8 minification and release lint still pass.
      - name: Debug and release builds
        if: ${{ !cancelled() }}
        # CI has no google-services.json (it's the owner's), so it says on purpose that this check build has no Firebase.
        run: ./gradlew :app:assembleDebug :app:assembleRelease -Pmeldiq.allowNoFirebase=true
      - name: Room schema files are committed
        if: ${{ !cancelled() }}
        run: |
          changes=$(git status --porcelain -- app/schemas)
          if [ -n "$changes" ]; then
            echo "::error::The build changed the Room schema files. Commit them with the migration:"
            echo "$changes"
            exit 1
          fi
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # One check to require in branch protection: it fails unless every job above succeeded.
  result:
    name: CI result
    if: ${{ always() }}
    needs: [server, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          SERVER: ${{ needs.server.result }}
          ANDROID: ${{ needs.android.result }}
          SERVER_ONLY: ${{ inputs.server_only }}
        run: |
          echo "server: $SERVER, android: $ANDROID"
          [ "$SERVER" = success ] && { [ "$ANDROID" = success ] || { [ "$SERVER_ONLY" = true ] && [ "$ANDROID" = skipped ]; }; }
